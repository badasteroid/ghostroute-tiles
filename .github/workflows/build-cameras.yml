# F-P2-T4 — Decoupled ALPR camera freshness pipeline.
#
# Runs on its OWN fast schedule, INDEPENDENT of the gigabyte-scale Valhalla
# tile bake (build-tiles.yml). ALPR cameras are crowd-added continuously, so
# they ship as a kilobyte artifact refreshed daily (or hourly) — a camera
# added today reaches phones tomorrow without anyone re-baking a 1.2 GB tile
# pack. Research + rationale: docs/design/CAMERA-FRESHNESS-AND-SEARCH.md.
#
# Output: a `cameras-latest` GitHub Release holding one tiny
# cameras-<state>.json per state + a cameras-catalog.json the app polls
# (ETag/version-check, like the tile catalog). The app downloads only the
# small files for the user's installed/nearby states. This is a STATIC
# artifact on a CDN built for distribution — sanctioned for live app use,
# unlike a per-user Overpass query.
#
# Data source: OpenStreetMap directly, under ODbL. build-camera-extract.py
# (the SINGLE camera producer — same script feeds the tile-bake sidecars via
# build-national.sh) classifies man_made=surveillance (surveillance:type
# alpr/anpr/gunshot/camera), highway=speed_camera, AND type=enforcement
# RELATIONS (~85% of enforcement data) into the app's typed tiers
# (schemaVersion 2, ids `overpass-<id>`). DeFlock has no bulk API; it reads
# from OSM, so we do too. Deletion-safe by construction: we filter a FULL
# state PBF (never an .osc change file — osmium-tool#163).

name: Build ALPR camera extracts

on:
  schedule:
    # Daily at 03:23 UTC — after Geofabrik's ~21:00 CET refresh, so each run
    # sees the freshest daily state extracts. ODD MINUTE, OFF-PEAK ON PURPOSE:
    # GitHub delays scheduled runs under load, worst at :00 and popular hours.
    # The old '0 8 * * *' actually fired at 11:26, 12:19, 12:50, 15:35, 19:42,
    # 18:27 (3-12 h late) — enough to trip the freshness watchdog on a healthy
    # day. The job is cheap (one tag-filter pass per state); add cron lines for
    # sub-daily freshness.
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      states:
        description: 'Comma-separated state ids to rebuild (blank = all)'
        required: false
        default: ''

permissions:
  contents: write  # publish release assets

jobs:
  # Generate the full state matrix from states.json (single source of truth,
  # shared with the tile workflow). Optional workflow_dispatch `states` input
  # narrows it for a targeted rebuild.
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      # WHICH CRON FIRED? (2026-09-20) Fire times cannot tell a stale '0 8' registration from a
      # live '23 3' one: this repo's scheduled runs drift 1.7-5.2 h (watchdog, measured per slot),
      # so 03:23 + drift and 08:00 + drift both land at ~08:00-08:50 UTC. `github.event.schedule`
      # is the cron string GitHub actually used — print it, and warn when it is not the one this
      # file declares. EXPECTED must be kept equal to the `cron:` line above.
      - name: Which schedule fired this run?
        if: github.event_name == 'schedule'
        env:
          FIRED: ${{ github.event.schedule }}
          EXPECTED: '23 3 * * *'
        run: |
          NOW="$(date -u +%H:%M)"
          echo "fired by cron '$FIRED' | file declares '$EXPECTED' | job started $NOW UTC"
          {
            echo "### Schedule"
            echo "fired by \`$FIRED\` · file declares \`$EXPECTED\` · job started $NOW UTC"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$FIRED" != "$EXPECTED" ]; then
            echo "::warning::STALE CRON — GitHub fired this run from '$FIRED' but the workflow declares '$EXPECTED'. See CAMERA-PIPELINE-HEALTH.md."
          fi
      - uses: actions/checkout@v4
      - id: gen
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          regions = json.load(open("scripts/ghostroute-tiles-workflow/states.json"))["regions"]
          wanted = [s.strip() for s in os.environ.get("STATES_FILTER", "").split(",") if s.strip()]
          rows = [{"id": r["id"], "path": r["path"]} for r in regions
                  if not wanted or r["id"] in wanted]
          print("matrix=" + json.dumps({"include": rows}))
          PY
        env:
          STATES_FILTER: ${{ github.event.inputs.states }}

  build:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium (pyosmium)
        run: pip install --quiet osmium

      - name: Download latest Geofabrik state extract
        run: |
          # Daily-fresh per-state PBF. (For sub-daily freshness, cache this
          # PBF across runs and `pyosmium-up-to-date region.osm.pbf` against
          # the Geofabrik <region>-updates feed before filtering — but NEVER
          # tag-filter the .osc diffs directly: osmium-tool#163.)
          #
          # Geofabrik returns 502/503 while its ~21:00 CET refresh republishes
          # every extract; that overload froze 11 states on 2026-08-28. curl's
          # built-in --retry alone exhausted inside the window, so wrap it in an
          # OUTER loop with a long sleep that outlasts a multi-minute refresh.
          # No mirror fallback: no public mirror carries the identical
          # <region>-latest.osm.pbf layout (GWDG/openstreetmap.fr both 404 it),
          # and a per-state failure no longer freezes the catalog now that the
          # catalog job runs with if: always() + a coverage floor.
          URL="https://download.geofabrik.de/${{ matrix.path }}-latest.osm.pbf"
          for attempt in 1 2 3 4; do
            if curl -fL --retry 6 --retry-delay 15 --retry-all-errors \
                    --retry-connrefused --max-time 900 -o region.osm.pbf "$URL"; then
              ls -lh region.osm.pbf
              exit 0
            fi
            echo "::warning::${{ matrix.id }}: Geofabrik download attempt $attempt failed; sleeping before retry."
            sleep 90
          done
          echo "::error::${{ matrix.id }}: Geofabrik unreachable after 4 rounds — skipping this state (its prior release asset is retained)."
          exit 1

      - name: Extract threat points (ALPR + enforcement tiers)
        run: |
          python3 scripts/ghostroute-tiles-workflow/build-camera-extract.py \
            region.osm.pbf "${{ matrix.id }}" "cameras-${{ matrix.id }}.json"

      - name: Vandalism / sanity guard
        run: |
          # Decision logic lives in camera-publish-guard.py (UNIT-TESTED in
          # test_camera_publish_guard.py) — the inline jq this replaces could
          # not be tested, and its count guard DEADLOCKED: blocking a publish
          # freezes the released baseline, so a real upstream drop (Wyoming
          # 546->143) could never self-heal. The script publishes a >30% drop
          # anyway IFF the new count is within +/-10% of an explicitly RATIFIED
          # baseline in camera-count-baselines.json. It still hard-blocks an
          # id-scheme regression (non 'overpass-' ids) and warns on wrong schema.
          FILE="cameras-${{ matrix.id }}.json"
          PREV_URL="https://github.com/${{ github.repository }}/releases/download/cameras-latest/cameras-${{ matrix.id }}.json"
          PREV_ARG=""
          if curl -fsL -o prev.json "$PREV_URL" 2>/dev/null; then
            PREV_ARG="--prev prev.json"
          else
            echo "no previous release asset; first publish"
          fi
          python3 scripts/ghostroute-tiles-workflow/camera-publish-guard.py \
            "$FILE" \
            --state "${{ matrix.id }}" \
            $PREV_ARG \
            --baselines scripts/ghostroute-tiles-workflow/camera-count-baselines.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Publish to cameras-latest release
        # 2026-09-14: `gh release upload --clobber` in a RETRY loop replaces
        # softprops/action-gh-release. The 2026-09-13 run lost 16 of 52 states to a
        # transient GitHub API outage ("Server Error" / HttpError fetching the release)
        # because the action makes ONE attempt; the same pattern build-tiles.yml already
        # uses. Overwrites the per-state asset in place — the release is a rolling
        # "latest" pointer, not a versioned tag. Uploading an asset never touches the
        # release's "Latest" flag, so the 2026-06-30 hijack (cameras-latest stealing
        # /releases/latest from tiles-latest — fresh installs 404'd, "Offline") cannot
        # recur from here; the create fallback below pins --latest=false explicitly.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R="${{ github.repository }}"
          if ! gh release view cameras-latest -R "$R" >/dev/null 2>&1; then
            gh release create cameras-latest -R "$R" --latest=false \
              --title "ALPR camera extracts (rolling)" \
              --notes "Rolling per-state camera extracts + cameras-catalog.json. Overwritten daily by build-cameras.yml."
          fi
          for attempt in 1 2 3 4 5; do
            if gh release upload cameras-latest "cameras-${{ matrix.id }}.json" -R "$R" --clobber; then
              echo "published cameras-${{ matrix.id }}.json (attempt $attempt)"; exit 0
            fi
            echo "::warning::${{ matrix.id }}: release upload attempt $attempt failed (GitHub API); retrying in $((attempt * 30)) s."
            sleep $((attempt * 30))
          done
          echo "::error::${{ matrix.id }}: release upload failed after 5 attempts — prior asset retained; catalog job will report coverage."
          exit 1

  catalog:
    needs: [setup, build]
    # if: always() — a SINGLE failed state must NOT skip the catalog. The
    # 2026-08-20..09-02 outage: Wyoming's guard failed the `build` job, so this
    # job (default `needs` gating = skip-if-any-dependency-failed) never ran, and
    # cameras-catalog.json froze at 2026-08-19 while 51/53 per-state assets
    # published fine — the app gates every download on the catalog, so it saw
    # NOTHING for 14 days. Run whenever setup produced a matrix; the build-side
    # per-state failures are tolerated because each state keeps its prior release
    # asset, and the coverage floor below refuses to publish a catalog that lost
    # too many states at once (a real mass outage, not one flaky state).
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build cameras-catalog.json
        run: |
          # Assemble the small catalog the app polls: per-state generatedAt +
          # count + asset URL. The app compares generatedAt to decide which
          # tiny files to re-download (ETag-style version check, like the
          # routing tile catalog).
          #
          # COVERAGE FLOOR: refuse to publish a catalog covering < 90% of the
          # states in states.json. A per-state asset that transiently failed to
          # (re)publish still resolves here from its PRIOR release asset, so a
          # low coverage number means a real mass outage (many assets missing
          # entirely) — publishing that catalog would strand the missing states'
          # devices. Below the floor we fail LOUDLY and keep the last-good
          # catalog rather than shrink the served set.
          python3 - <<'PY'
          import json, os, sys, urllib.request
          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://github.com/{repo}/releases/download/cameras-latest"
          regions = json.load(open("scripts/ghostroute-tiles-workflow/states.json"))["regions"]
          entries, missing = [], []
          for r in regions:
              sid = r["id"]
              try:
                  with urllib.request.urlopen(f"{base}/cameras-{sid}.json") as resp:
                      meta = json.load(resp)
                  entries.append({
                      "stateId": sid,
                      "generatedAt": meta["generatedAt"],
                      "count": meta["count"],
                      "url": f"{base}/cameras-{sid}.json",
                  })
              except Exception as e:
                  missing.append(sid)
                  print(f"skip {sid}: {e}")
          total = len(regions)
          coverage = len(entries) / total if total else 0
          print(f"catalog: {len(entries)}/{total} states ({coverage:.1%}); missing: {missing}")
          FLOOR = 0.90
          if coverage < FLOOR:
              print(f"::error::catalog coverage {coverage:.1%} < {FLOOR:.0%} "
                    f"({len(missing)} states missing) — refusing to publish a shrunken catalog; "
                    f"keeping the last-good one. Missing: {missing}")
              sys.exit(1)
          # schemaVersion 2: aligned with the per-state cameras-<state>.json files
          # (build-camera-extract.py now stamps schemaVersion 2 — typed tiers +
          # canonical overpass- ids). The client's ACCEPTED_SCHEMA accepts {1,2} so
          # a device mid-rollout is never orphaned by the bump.
          json.dump({"schemaVersion": 2, "states": entries}, open("cameras-catalog.json", "w"))
          print(f"catalog written: {len(entries)} states")
          PY
      - name: Publish catalog
        # Same retrying upload as the per-state publish step (2026-09-14); the catalog is
        # the ONE asset every device gates on, so a transient API error here must not
        # freeze it. Uploading never touches the release's "Latest" flag.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          R="${{ github.repository }}"
          for attempt in 1 2 3 4 5; do
            if gh release upload cameras-latest cameras-catalog.json -R "$R" --clobber; then
              echo "published cameras-catalog.json (attempt $attempt)"; exit 0
            fi
            echo "::warning::catalog upload attempt $attempt failed (GitHub API); retrying in $((attempt * 30)) s."
            sleep $((attempt * 30))
          done
          echo "::error::cameras-catalog.json upload failed after 5 attempts — devices keep the previous catalog; the freshness watchdog will alarm."
          exit 1
